apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wiz-vulnerable-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/lucafeudi/wiz-exercise.git'
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: wiz-app-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
