apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-workload-sa
  namespace: wiz-app-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-overprivileged-binding
subjects:
- kind: ServiceAccount
  name: app-workload-sa
  namespace: wiz-app-ns
roleRef:
  kind: ClusterRole
  name: cluster-admin # Extreme RBAC privilege violation (Critical Severity Finding)
  apiGroup: rbac.authorization.k8s.io
