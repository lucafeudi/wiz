name: Deploy IaC with Terraform

on:
  push:
    branches: [ wiz ]
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud via WIF
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/957162898991/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
        service_account: 'github-ci-sa@clgcporg10-157.iam.gserviceaccount.com'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: cd terraform && terraform init

    - name: Terraform Apply
      run: cd terraform && terraform apply -auto-approve -var="project_id=clgcporg10-157"
