name: Build and Deploy App CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud via WIF
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/957162898991/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
        service_account: 'github-ci-sa@clgcporg10-157.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev

    - name: Build and Push Container Image
      run: |
        docker build -t europe-west1-docker.pkg.dev/clgcporg10-157/wiz-repo/todo-app:latest ./app
        docker push europe-west1-docker.pkg.dev/clgcporg10-157/wiz-repo/todo-app:latest

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: 'wiz-gke-cluster'
        location: 'europe-west1-b'

    - name: Deploy to Kubernetes
      run: |
        # Fetch the internal IP of the MongoDB VM directly using gcloud
        MONGO_IP=$(gcloud compute instances describe wiz-mongodb-vm \
          --zone=europe-west1-b \
          --project=clgcporg10-157 \
          --format='get(networkInterfaces[0].networkIP)')
        
        echo "Using MongoDB IP: $MONGO_IP"
        
        # Replace placeholders in k8s manifests and apply
        sed -i "s/PROJECT_ID/clgcporg10-157/g" k8s/deployment.yaml
        sed -i "s/MONGODB_VM_IP/$MONGO_IP/g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml