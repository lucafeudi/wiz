name: "IaC Security & Deploy Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  iac-validation:
    name: "Validate & Scan IaC"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format Check
      run: terraform fmt -check -recursive .

    - name: Terraform Init
      run: cd terraform && terraform init -backend=false

    - name: Terraform Validate
      run: cd terraform && terraform validate

    - name: Run Checkov Static Analysis
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform
        output_format: cli
        soft_fail: true # Soft fail allows pipeline execution to continue but logs security posture defects

    - name: Run tfsec Security Scan
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        soft_fail: true

  iac-deploy:
    name: "Deploy Infrastructure"
    needs: iac-validation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ vars.GCP_PROJECT_ID }}

    - name: Terraform Apply
      env:
        TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      run: |
        cd terraform
        terraform init -input=false
        terraform apply -input=false -auto-approve
