name: "App Build, Scan & Deploy Pipeline"

on:
  push:
    branches: [ "main" ]

jobs:
  app-lifecycle:
    name: "Container Security Operations"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Authenticate to GCP Registry
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker CLI
      run: gcloud auth configure-docker --quiet

    - name: Build Local Container Image
      run: |
        docker build -t custom-app:local .

    - name: Generate Software Bill of Materials (SBOM) using Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        syft custom-app:local -o spdx-json=sbom.json

    - name: Vulnerability Scan container using Trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy image --severity HIGH,CRITICAL --format table custom-app:local

    - name: Install Cosign for Image Signing
      uses: sigstore/cosign-installer@v3.1.1

    - name: Setup Cosign Key
      run: |
        echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
        # Sign container to establish secure supply chain lineage
        # cosign sign --key cosign.key gcr.io/wiz-exercise-dev/custom-app:latest

    - name: Tag and Push Image to Google Artifact Registry
      run: |
        docker tag custom-app:local gcr.io/wiz-exercise-dev/custom-app:latest
        docker push gcr.io/wiz-exercise-dev/custom-app:latest

    - name: Trigger Kubernetes Apply
      run: |
        gcloud container clusters get-credentials gke-cluster --region europe-west1
        kubectl apply -f kubernetes/
